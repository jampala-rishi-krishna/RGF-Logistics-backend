services:
  - type: web
    name: intellifleet-api
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_MINUTES
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DISPATCH_PHONE
        sync: false
      - key: JWT_DRIVER_EXPIRE_MINUTES
        sync: false
      # Trip photo storage switch: gdrive | r2 | none (docs/GDRIVE_MEDIA.md). Unset = gdrive when the GDRIVE_* env is
      # complete, else r2 when every R2_* is set, else none (the driver app hides photo and signature fields).
      - key: MEDIA_STORAGE
        sync: false
      # Google Drive (default store): folder owned by martin@ + martin@'s Drive refresh token (scope drive). The OAuth
      # client reuses GMAIL_COMMS_CLIENT_ID / _SECRET unless GDRIVE_CLIENT_ID / _SECRET are set. Never commit values.
      - key: GDRIVE_PHOTO_FOLDER_ID
        sync: false
      - key: GDRIVE_REFRESH_TOKEN
        sync: false
      - key: GDRIVE_CLIENT_ID
        sync: false
      - key: GDRIVE_CLIENT_SECRET
        sync: false
      # Cloudflare R2 object storage (previous store; old photo rows still resolve through it when set). Secrets: set in Render, never commit values.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ORG_ID
        sync: false
      - key: ZOHO_ACCOUNTS_URL
        sync: false
      - key: ZOHO_API_DOMAIN
        sync: false
      - key: ZOHO_SCOPES
        sync: false
      - key: ZOHO_ACKNOWLEDGED_CUSTOMVIEW_ID
        sync: false
      - key: ZOHO_LOCK_CLIENT_ID
        sync: false
      - key: ZOHO_LOCK_CLIENT_SECRET
        sync: false
      - key: ZOHO_LOCK_REFRESH_TOKEN
        sync: false
      - key: ZOHO_SO_LOCK_CONFIGURATION_ID
        sync: false
      - key: ZOHO_SO_LOCK_API_BASE
        value: https://www.zohoapis.com/inventory/v1
      - key: ZOHO_SO_LOCK_MODE
        value: webhook
      - key: ZOHO_SO_LOCK_WEBHOOK_URL
        sync: false
      - key: CARTRACK_USERNAME
        sync: false
      - key: CARTRACK_API_KEY
        sync: false
      - key: CARTRACK_BASE_URL
        sync: false
      - key: CARTRACK_POLL_INTERVAL_SECONDS
        sync: false
      - key: FLEET_ZOHO_SYNC_INTERVAL_SECONDS
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_ROUTE_OPTIMIZATION_PROJECT
        sync: false
      - key: MAPBOX_SERVER_TOKEN
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: MAPBOX_ROUTING_ENABLED
        sync: false
      - key: MAPBOX_PROFILE
        sync: false
      - key: MAPBOX_MATRIX_BATCH_SIZE
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: INTELLIFLEET_ASSIGNMENT_WEBHOOK_SECRET
        sync: false
      - key: DISPATCH_N8N_DRIVER_BROADCAST_URL
        sync: false
      - key: DISPATCH_N8N_CUSTOMER_NOTIFY_URL
        sync: false
      - key: DISPATCH_N8N_INTERNAL_ESCALATION_URL
        sync: false
      - key: N8N_API_KEY
        sync: false
      - key: STAFF_DIRECTORY_SNAPSHOT_PATH
        value: /etc/secrets/staff_directory.json
      - key: GMAIL_COMMS_CLIENT_ID
        sync: false
      - key: GMAIL_COMMS_CLIENT_SECRET
        sync: false
      - key: GMAIL_COMMS_REFRESH_TOKEN
        sync: false
      # Logistics sender identity - PENDING. Leave GMAIL_FROM_ADDRESS EMPTY until
      # martin.logistics@rareglobalfood.com is a verified Send-As alias on the authenticated
      # mailbox (check GET /api/gmail/identity), then set: GMAIL_FROM_ADDRESS=
      # martin.logistics@rareglobalfood.com, GMAIL_FROM_NAME=Martin Cuico,
      # GMAIL_REPLY_TO=martin.logistics@rareglobalfood.com. Sends are refused while an
      # unavailable alias is configured.
      - key: GMAIL_FROM_ADDRESS
        sync: false
      - key: GMAIL_FROM_NAME
        sync: false
      - key: GMAIL_REPLY_TO
        sync: false
      # Inbound Logistics email agent - keep false until the n8n agent is deactivated (cutover).
      - key: LOGISTICS_AGENT_ENABLED
        value: "false"
      - key: LOGISTICS_AGENT_POLL_SECONDS
        value: "60"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ROUTE_DISTANCE_COST_PER_KM
        sync: false
      - key: ROUTE_DIESEL_PRICE_PER_LITER
        value: "95"
      - key: ROUTE_FUEL_KM_PER_LITER
        value: "7"
      - key: ROUTE_DRIVER_COST_PER_HOUR
        value: "120"
      - key: ROUTE_HELPER_COST_PER_HOUR
        value: "120"
      - key: ROUTE_REFRIGERATION_LITERS_PER_HOUR_CHILLED
        value: "0.8"
      - key: ROUTE_REFRIGERATION_LITERS_PER_HOUR_FROZEN
        value: "1.2"
      - key: ROUTE_REFRIGERATION_ON_RETURN_LEG
        value: "false"
      - key: ROUTE_TOLLS_ENABLED
        value: "true"
      - key: ROUTE_TOLL_VEHICLE_CLASS
        value: "2"
      - key: ROUTE_TOLL_CLASS2_MULTIPLIER
        value: "2.0"
      - key: ROUTE_TOLL_CLASS3_MULTIPLIER
        value: "3.0"
      - key: ROUTE_BALANCED_TIME_WEIGHT
        sync: false
      - key: ROUTE_BALANCED_DISTANCE_WEIGHT
        sync: false
      - key: ROUTE_BALANCED_COST_WEIGHT
        sync: false
      - key: VOICE_CALLS_DEFAULT
        value: "paused"
